name: publish

# Triggered by pushing a v* tag (e.g. v0.1.0), or manually via the Actions
# UI / GitHub API by dispatching with a ref.
#
# Auth: npm Trusted Publishing (OIDC) once configured at npmjs.com. Until
# then, the first publish needs an NPM_TOKEN repo secret. After the package
# exists, configure Trusted Publishing at:
#   https://www.npmjs.com/package/kxco-verify/access  →  Trusted Publishers
# Bind to:  org=KnightsbridgeAIQ  repo=kxco-verify  workflow=publish.yml
#
# This said org=JackKXCO until 13 Sep 2026. The repositories moved to the
# KnightsbridgeAIQ org and the binding instruction was never updated, so
# anyone configuring from this comment would have bound a stale org.
# The NPM_TOKEN fallback this used to describe has been removed.
#
# All third-party actions pinned by 40-char commit SHA.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or ref to publish (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  # contents: write is needed to attach the SBOM to the GitHub Release. An
  # Actions artifact is not a published SBOM: it expires on the retention
  # window and needs an authenticated GitHub session to fetch, so a third party
  # assessing supply chain posture cannot read it. A release asset is a
  # permanent unauthenticated URL, which is the thing being claimed.
  contents: write
  id-token: write   # required for npm provenance (and Trusted Publishing)

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Node 22 with npm registry
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm CLI to the 11.x line
        # Trusted Publishing's OIDC integration arrived in npm 11.5.1 and the npm
        # bundled with Node 20 is 10.x, so this job could never authenticate that
        # way no matter what is configured on the npm side. Node 22 plus npm 11
        # matches the eleven sibling repos and the one package that publishes
        # successfully today.
        #
        # Pinned to the 11.x line, never @latest: npm 12 requires
        # Node ^22.22 || ^24.15 || >=26 and broke this exact step once already.
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # No NODE_AUTH_TOKEN. This step used to carry a long-lived NPM_TOKEN as a
      # bootstrap fallback, described in a comment as safe to leave because the
      # npm CLI ignores it when OIDC succeeds. It is not safe to leave: a token
      # that can publish without a second factor is exactly what npm is removing
      # (account changes Aug 2026, direct publish Jan 2027), and while it sat here
      # any run that failed OIDC would silently fall back to it. Two packages in
      # this family were published under the user account rather than through
      # Actions for that reason. Trusted Publishing is now the only path in.
      - name: Publish (provenance via OIDC; uses Trusted Publishing once configured)
        run: npm publish --provenance --access public

      # The SBOM runs AFTER the publish and cannot fail the job. The package is
      # already on the registry by this point, so failing here would misreport a
      # completed release. npm generates it from the tree that was actually
      # installed for this build rather than a re-resolved one.
      - name: Generate CycloneDX SBOM
        continue-on-error: true
        run: |
          npm sbom --sbom-format cyclonedx --sbom-type library > sbom.cyclonedx.json
          node -e "const s=require('./sbom.cyclonedx.json');console.log('components:',s.components.length)"

      # Publish it at a stable, unauthenticated URL:
      #   https://github.com/<org>/<repo>/releases/download/<tag>/sbom.cyclonedx.json
      #
      # gh is preinstalled on the runner, so this adds no third-party action to
      # pin. --clobber makes a re-dispatch of the same tag idempotent.
      - name: Publish the SBOM on the GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.ref || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" sbom.cyclonedx.json --clobber
