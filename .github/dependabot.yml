version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: deps
      include: scope
    # @noble/post-quantum 0.7.1 fails nine NIST ACVP SLH-DSA verification
    # vectors that 0.7.0 passes, returning false where the vectors require true,
    # so a package running it can reject a valid signature. Reported upstream.
    # Reproduce with, in kxco-post-quantum:
    #   node conformance/run-acvp.mjs --set SLH-DSA-sigVer-FIPS205 --max-per-group 3
    # This blocks that one version only. 0.7.2 and later will still be proposed,
    # and should be accepted once the vectors pass again.
    ignore:
      - dependency-name: "@noble/post-quantum"
        versions: ["0.7.1"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
